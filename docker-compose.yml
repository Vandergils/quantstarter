services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: change_me
      MYSQL_DATABASE: quantstarter
    ports:
      - "127.0.0.1:3306:3306"   # only reachable from this computer
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - dbdata:/var/lib/mysql
volumes:
  dbdata: