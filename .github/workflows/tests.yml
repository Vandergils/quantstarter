name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Installs everything a new user installs, plus the test tools. This also proves that
      # requirements.txt resolves on each Python version. No database or exchange access is needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes api engine collector cpp tests

      # Optional C++ module. If it fails to build, the tests still run on the pandas fallback.
      - name: Build C++ indicators (optional)
        continue-on-error: true
        run: python cpp/build.py

      # Say out loud which indicators the next step uses, so a silent C++ build failure is visible.
      - name: Report which indicators are used
        run: python -c "import sys; sys.path.insert(0, 'engine'); import fast; print('C++ indicators loaded:', fast.using_cpp())"

      - name: Run tests
        run: python -m pytest -v

      # The same tests again on the pandas indicators, which every user without a compiler runs.
      - name: Run tests (pandas indicators only)
        env:
          QUANTSTARTER_NO_CPP: "1"
        run: python -m pytest -q