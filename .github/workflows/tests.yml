name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tests only need these three. No database or exchange access is required.
      - name: Install test dependencies
        run: python -m pip install pandas numpy pytest

      # Optional C++ module. If it fails to build, the tests still run on the pandas fallback.
      - name: Build C++ indicators (optional)
        continue-on-error: true
        run: python cpp/build.py

      - name: Run tests
        run: python -m pytest tests -v